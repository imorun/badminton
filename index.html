<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>バドミントン快適チェッカー</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
</head>

<body>

    <canvas id="canvas"></canvas>

    <div class="topbar">
        <button onclick="scrollToSection('weather')">
            天気
        </button>

        <button onclick="scrollToSection('map')">
            地図
        </button>

        <button onclick="scrollToSection('sensor')">
            センサー
        </button>
    </div>

    <div class="container">
        <section id="weather">
            <h1>バドミントン快適チェッカー</h1>

            <div class="location">
                35.6327937 , 139.5504509
            </div>

            <div class="weather-grid">

                <div class="card">
                    <div class="label">温度</div>
                    <div class="value" id="temp">--</div>
                </div>

                <div class="card">
                    <div class="label">湿度</div>
                    <div class="value" id="humidity">--</div>
                </div>

                <div class="card">
                    <div class="label">風速</div>
                    <div class="value" id="wind">--</div>
                </div>

                <div class="card">
                    <div class="label">風向き</div>
                    <div class="value" id="winddir">--</div>
                    <div id="arrow" style="font-size: 24px; display: inline-block; transition: transform 0.5s ease-out;">↑</div>
                </div>

            </div>

            <div id="result">
                読み込み中...
            </div>

            <div class="info">
                <table>
                    <tr>
                        <th>条件</th>
                        <th>評価</th>
                    </tr>

                    <tr>
                        <td>20〜24℃ / 湿度40〜60%</td>
                        <td>🏸 最高</td>
                    </tr>

                    <tr>
                        <td>25〜28℃</td>
                        <td>😅 暑め</td>
                    </tr>

                    <tr>
                        <td>29℃以上</td>
                        <td>🥵 暑い</td>
                    </tr>

                    <tr>
                        <td>14℃以下</td>
                        <td>🥶 寒い</td>
                    </tr>
                </table>
            </div>
        </section>

        <section id="map">
            <h1>🗺 現在位置マップ</h1>
            <div class="map-box">
                <iframe src="https://maps.google.com/maps?q=35.6327937,139.5504509&z=16&output=embed">
                </iframe>
            </div>
        </section>

        <section id="sensor">
            <button id="orientation-btn" onclick="enableOrientation()">
                方向センサーを有効化
            </button>
            <h1>🧭 方角と風向き</h1>
            <div class="sensor-container">
                <div class="compass">
                    <div class="compass-rose" id="compassRose">
                        <div class="mark north">北</div>
                        <div class="mark east">東</div>
                        <div class="mark south">南</div>
                        <div class="mark west">西</div>
                        <div class="needle wind-needle" id="windNeedle">
                            <div class="needle-label">風</div>
                        </div>
                    </div>
                    <div class="needle device-needle">
                        <div class="needle-label">自分</div>
                    </div>
                </div>
                
                <div class="sensor-info">
                    <div class="info-item">
                        <span class="label">自分の向き:</span>
                        <span class="value" id="deviceHeading">--</span>
                    </div>
                    <div class="info-item">
                        <span class="label">風の向き:</span>
                        <span class="value" id="windDirection">--</span>
                    </div>
                </div>
                <p class="hint">
                    スマホを水平に持ち、風の吹いてくる方向を確認しましょう
                </p>
            </div>
        </section>
    </div>
    <script src="script.js"></script>
</body>

</html>
